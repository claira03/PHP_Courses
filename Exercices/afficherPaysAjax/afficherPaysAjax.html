<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recherche de pays Ajax</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        body {
            background-color: #f4f6fa;
        }

        .contenu {
            max-width: 720px;
            margin: 60px auto;
        }

        .card {
            border: 0;
            border-radius: 14px;
            box-shadow: 0 5px 20px #1b284014;
        }

        .code-pays {
            font-size: .85rem;
        }
    </style>

    <script>

        $(document).ready(function () {

            $("#txtPays").keyup(function () {

                let recherche = $(this).val();

                $.get(
                    "getPays.php",
                    { txtPays: recherche },

                    function (data) {

                        $("#resultats").html(data);

                    }
                );

            });

        });

    </script>

</head>

<body>

    <main class="container contenu">

        <h1 class="text-center mb-2">Recherche de pays</h1>

        <p class="text-center text-secondary mb-4">
            Trouvez un pays à partir de son nom.
        </p>

        <div class="card p-4 mb-4">

            <label for="txtPays" class="form-label fw-semibold">
                Nom du pays
            </label>

            <input
                type="text"
                class="form-control"
                id="txtPays"
                name="txtPays"
                placeholder="Ex. : af, can, united">

        </div>

        <div id="resultats"></div>

    </main>

</body>

</html>
